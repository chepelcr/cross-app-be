services:
  api:
    build:
      context: .
      platforms:
        - linux/amd64
    platform: linux/amd64
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ~/.aws:/root/.aws:ro
      - ./alembic:/var/task/alembic
      - ./alembic.ini:/var/task/alembic.ini
    entrypoint: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-keep-alive", "75"]
