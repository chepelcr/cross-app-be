AWSTemplateFormatVersion: "2010-09-09"

Description: CodePipeline for Cross-Docking Backend (cd-backend) - builds Docker image, updates Lambda, and refreshes API Gateway

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stag, prod]

  SourceOwnerParam:
    Type: String
    Default: chepelcr

  SourceRepoParam:
    Type: String
    Default: cross-app-be

  SourceBranchParam:
    Type: String
    Default: develop

  BuildComputeTypeParam:
    Type: String
    Default: BUILD_GENERAL1_SMALL
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE

  ApiDomainParam:
    Type: String
    Default: "orders-api.jcampos.dev"

  RootDomainParam:
    Type: String
    Default: "jcampos.dev"

Resources:
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jcampos-${Environment}-cd-backend-build"
      RetentionInDays: 14

  UpdateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jcampos-${Environment}-cd-backend-update"
      RetentionInDays: 14

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/jcampos-${Environment}-cd-backend-api-gateway"
      RetentionInDays: 14

  LambdaImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jcampos-${Environment}-cd-backend-build"
      Description: Build Docker image for cd-backend and push to ECR
      ServiceRole: !ImportValue
        'Fn::Sub': "jcampos-${Environment}-codebuild-web-service-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref BuildComputeTypeParam
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: REGION
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-build.yml
      TimeoutInMinutes: 120
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup

  UpdateFunctionsProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jcampos-${Environment}-cd-backend-update"
      Description: Update cd-backend Lambda function code to latest ECR image
      ServiceRole: !ImportValue
        'Fn::Sub': "jcampos-${Environment}-codebuild-web-service-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: REGION
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-update.yml
      TimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref UpdateLogGroup

  ApiGatewayUpdateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "jcampos-${Environment}-cd-backend-api-gateway"
      Description: Regenerate api-gateway/template.yml from app and deploy API Gateway SAM stack
      ServiceRole: !ImportValue
        'Fn::Sub': "jcampos-${Environment}-codebuild-web-service-role-arn"
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref BuildComputeTypeParam
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: REGION
            Value: !Ref AWS::Region
          - Name: API_DOMAIN
            Value: !Ref ApiDomainParam
          - Name: ROOT_DOMAIN
            Value: !Ref RootDomainParam
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-api.yml
      TimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref ApiGatewayLogGroup

  CdBackendPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "jcampos-${Environment}-cd-backend-pipeline"
      RoleArn: !ImportValue
        'Fn::Sub': "jcampos-${Environment}-codepipeline-role-arn"
      ArtifactStore:
        Type: S3
        Location: !ImportValue
          'Fn::Sub': "jcampos-${Environment}-codepipeline-artifacts-bucket-name"
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !ImportValue
                  'Fn::Sub': "jcampos-${Environment}-github-connection-arn"
                FullRepositoryId: !Sub "${SourceOwnerParam}/${SourceRepoParam}"
                BranchName: !Ref SourceBranchParam
                DetectChanges: "true"
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceCode
              RunOrder: 1

        - Name: BuildImages
          Actions:
            - Name: BuildDockerImage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref LambdaImageBuildProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},{"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

        - Name: UpdateFunctions
          Actions:
            - Name: UpdateLambda
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref UpdateFunctionsProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},{"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: UpdateOutput
              RunOrder: 1

        - Name: UpdateApiGateway
          Actions:
            - Name: UpdateApiGateway
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref ApiGatewayUpdateProject
                EnvironmentVariables: !Sub |
                  [{"name":"ENVIRONMENT","value":"${Environment}","type":"PLAINTEXT"},{"name":"REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"API_DOMAIN","value":"${ApiDomainParam}","type":"PLAINTEXT"},{"name":"ROOT_DOMAIN","value":"${RootDomainParam}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: ApiOutput
              RunOrder: 1

Outputs:
  PipelineName:
    Description: CodePipeline name
    Value: !Ref CdBackendPipeline
    Export:
      Name: !Sub "jcampos-${Environment}-cd-backend-pipeline-name"
