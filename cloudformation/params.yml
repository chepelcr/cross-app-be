AWSTemplateFormatVersion: '2010-09-09'
Description: >
  JCAMPOS Cross-Docking Backend Services - SSM Parameters.
  Single resource per parameter; environment encoded in the path via !Sub.
  Path prefix: /tsuru/{env}/cd-backend  (matches app/settings.cfg ssmpath).
  DB credentials are NOT here — they live in Secrets Manager under
  tsuru/{env}/database, shared with other services.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stag, prod]
    Description: Deployment environment

  S3Bucket:
    Type: String
    Description: S3 bucket name for file uploads
    Default: "tsuru-uploads-dev"

  PdfDomain:
    Type: String
    Description: Public domain for serving PDF/file URLs
    Default: "https://uploads.tsuru.jcampos.dev"

  EmailSender:
    Type: String
    Description: SES verified sender address
    Default: "tsuru@jcampos.dev"

  EmailRecipient:
    Type: String
    Description: Default email recipient
    Default: "tsuru@jcampos.dev"

  ApiServicesUrl:
    Type: String
    Description: Internal (data) services API base URL
    Default: "https://data-api.tsuru.jcampos.dev"

  ApiOrganizationsUrl:
    Type: String
    Description: Organizations API URL template
    Default: "https://api.tsuru.jcampos.dev/api/organizations/%s"

  # ── Optional parameters (guarded by Conditions) ───────────────────────
  CloudfrontDistributionId:
    Type: String
    Description: CloudFront distribution ID for cache invalidation (optional)
    Default: ""

  WkhtmltopdfPath:
    Type: String
    Description: Absolute path to wkhtmltopdf binary
    Default: "/usr/local/bin/wkhtmltopdf"

# ---------------------------------------------------------------------------
# Conditions — skip optional params when no value is provided
# ---------------------------------------------------------------------------
Conditions:
  HasCloudfrontDistributionId: !Not [!Equals [!Ref CloudfrontDistributionId, ""]]

# ---------------------------------------------------------------------------
# Resources  — one SSM parameter per entry
# ---------------------------------------------------------------------------
Resources:

  # /tsuru/{env}/cd-backend/aws/stage
  AwsStage:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/aws/stage"
      Type: String
      Value: !Ref Environment
      Description: !Sub "Deployment stage for Cross-Docking Backend (${Environment})"

  # /tsuru/{env}/cd-backend/aws/region
  AwsRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/aws/region"
      Type: String
      Value: !Ref AWS::Region
      Description: AWS region

  # /tsuru/{env}/cd-backend/aws/database
  # Points to the shared Secrets Manager secret name (same secret used by data-services)
  AwsDatabase:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/aws/database"
      Type: String
      Value: !Sub "tsuru/${Environment}/database"
      Description: Shared Secrets Manager secret name for database credentials

  # /tsuru/{env}/cd-backend/s3/bucket
  S3BucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/s3/bucket"
      Type: String
      Value: !Ref S3Bucket
      Description: S3 bucket for file uploads

  # /tsuru/{env}/cd-backend/pdf/domain
  PdfDomainParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/pdf/domain"
      Type: String
      Value: !Ref PdfDomain
      Description: Public domain for serving PDF/file URLs

  # /tsuru/{env}/cd-backend/email/sender
  EmailSenderParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/email/sender"
      Type: String
      Value: !Ref EmailSender
      Description: SES verified sender address

  # /tsuru/{env}/cd-backend/email/recipient
  EmailRecipientParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/email/recipient"
      Type: String
      Value: !Ref EmailRecipient
      Description: Default email recipient

  # /tsuru/{env}/cd-backend/api/services/url
  ApiServicesUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/api/services/url"
      Type: String
      Value: !Ref ApiServicesUrl
      Description: Internal services API base URL

  # /tsuru/{env}/cd-backend/api/organizations/url
  ApiOrganizationsUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/api/organizations/url"
      Type: String
      Value: !Ref ApiOrganizationsUrl
      Description: Organizations API URL template

  # /tsuru/{env}/cd-backend/cloudfront/distribution/id  (optional)
  CloudfrontDistributionIdParam:
    Type: AWS::SSM::Parameter
    Condition: HasCloudfrontDistributionId
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/cloudfront/distribution/id"
      Type: String
      Value: !Ref CloudfrontDistributionId
      Description: CloudFront distribution ID for cache invalidation

  # /tsuru/{env}/cd-backend/path/to/wkhtmltopdf
  WkhtmltopdfPathParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/cd-backend/path/to/wkhtmltopdf"
      Type: String
      Value: !Ref WkhtmltopdfPath
      Description: Absolute path to wkhtmltopdf binary

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  SsmBasePath:
    Description: SSM base path for all Cross-Docking Backend parameters
    Value: !Sub "/tsuru/${Environment}/cd-backend"
    Export:
      Name: !Sub "tsuru-${Environment}-cd-backend-ssm-base-path"
